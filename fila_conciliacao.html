<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fila de Conciliação — Proos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --surface-0:#ffffff; --surface-2:#eef1f8; --border:#e0e4ee;
  --brand:#215ba8; --brand-soft:#dde6f5;
  --text:#16223d; --text-2:#57617a; --text-3:#8891a6;
  --bom:#0ca30c; --atencao:#c98200; --serio:#c1602e; --critico:#d03b3b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--surface-2);color:var(--text);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;
}
h1,h2,h3,.t{font-family:'Archivo',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 48px}

header.top{
  background:var(--surface-0);border-bottom:1px solid var(--border);
  padding:14px 14px calc(14px);position:sticky;top:0;z-index:20;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  margin-top:calc(-1 * env(safe-area-inset-top,0px));
}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:'Archivo';font-weight:800;color:var(--brand);font-size:19px;letter-spacing:-.02em}
.logo span{color:var(--text-3);font-weight:600;font-size:12px;margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.ctx{margin-left:auto;font-size:12px;color:var(--text-2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--surface-0);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600}
.kpi .val{font-family:'IBM Plex Mono';font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--text-2);margin-top:2px}
.kpi.ok .val{color:var(--bom)} .kpi.warn .val{color:var(--atencao)} .kpi.crit .val{color:var(--critico)}

.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--border);margin:2px 0 18px}
.bar i{display:block;height:100%}

.panel{background:var(--surface-0);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
.ph{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:15px}
.ph .note{font-size:11.5px;color:var(--text-3);width:100%;margin:0}

.filters{display:flex;gap:6px;flex-wrap:wrap;padding:11px 15px;border-bottom:1px solid var(--border);background:#fafbfe}
.chip{border:1px solid var(--border);background:var(--surface-0);color:var(--text-2);
  border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.chip .n{font-family:'IBM Plex Mono';font-size:11px;opacity:.8}

.item{border-bottom:1px solid var(--border);padding:13px 15px}
.item:last-child{border-bottom:none}
.item.done{opacity:.5}
.row1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dt{font-family:'IBM Plex Mono';font-size:12px;color:var(--text-3);min-width:74px}
.vl{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.vl.neg{color:var(--critico)} .vl.pos{color:var(--bom)}
.desc{flex:1;min-width:190px;font-size:13.5px;color:var(--text)}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;
  padding:3px 7px;border-radius:5px;white-space:nowrap}
.tag.auto{background:#e3f5e3;color:var(--bom)}
.tag.rev{background:#fdf0da;color:var(--atencao)}
.tag.exc{background:#fbe3e3;color:var(--critico)}
.score{font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-3)}

.sug{margin-top:9px;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px}
.sug .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;display:block;margin-bottom:3px}
.sug .why{font-size:12px;color:var(--text-2);margin-top:5px}
.ev{display:inline-block;background:var(--surface-0);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;margin:3px 4px 0 0;font-size:11px;color:var(--text-2)}
.ev b{font-family:'IBM Plex Mono';color:var(--brand)}

.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface-0);color:var(--text);
  border-radius:7px;padding:7px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#1a4a8c;color:#fff}
.btn.ghost{color:var(--text-3)}

.alt{margin-top:8px;font-size:12px}
.alt summary{cursor:pointer;color:var(--text-2);font-size:12px}
.alt table{width:100%;border-collapse:collapse;margin-top:7px;font-size:12px}
.alt td{padding:5px 7px;border-top:1px solid var(--border)}
.alt td:last-child{text-align:right;font-family:'IBM Plex Mono'}

.empty{padding:34px 16px;text-align:center;color:var(--text-3);font-size:13.5px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:30px 18px;text-align:center;
  background:var(--surface-0);margin-bottom:16px}
.drop.on{border-color:var(--brand);background:var(--brand-soft)}
.drop p{margin:6px 0;color:var(--text-2);font-size:13px}
.tablewrap{overflow-x:auto}
@media(max-width:640px){
  .dt{min-width:auto}
  .kpi .val{font-size:20px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo">proos <span>conciliação</span></div>
  <div class="ctx" id="ctx">nenhum lote carregado</div>
</div></header>

<div class="wrap">

  <div class="drop" id="drop">
    <p><b>Arraste o <span class="mono">sombra_resultado.json</span> aqui</b></p>
    <p>ou <button class="btn" id="pick">escolher arquivo</button>
       &nbsp;·&nbsp; <button class="btn ghost" id="demo">ver com dados de exemplo</button></p>
    <input type="file" id="file" accept=".json" hidden>
  </div>

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="bar" id="bar"></div>

    <div class="panel">
      <div class="ph">
        <h2>Fila do operador</h2>
        <p class="note">Ordenada por impacto: maior valor primeiro, depois idade da pendência.
           Cada item já chega com a investigação feita — decidir, não pesquisar.</p>
      </div>
      <div class="filters" id="filters"></div>
      <div id="lista"></div>
    </div>
  </div>
</div>

<script>
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = v => (v<0?'−':'') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const DT  = s => s ? s.split('-').reverse().slice(0,2).join('/') : '';

const ROTULO = {
  sem_titulo_saida:'Sem título (saída)', sem_titulo_entrada:'Sem título (entrada)',
  divergencia_valor:'Divergência de valor', ambiguidade:'Ambiguidade',
  transferencia_sem_par:'Transferência sem par', cadastro:'Cadastro',
  duplicidade:'Duplicidade'
};
const ACAO = {
  sem_titulo_saida:['Criar contas a pagar','Marcar como despesa direta'],
  sem_titulo_entrada:['Criar contas a receber','Marcar a identificar'],
  divergencia_valor:['Aceitar como parcial','Aceitar com ajuste','Rejeitar candidato'],
  ambiguidade:['Escolher candidato'],
  transferencia_sem_par:['Confirmar transferência','Reclassificar'],
  cadastro:['Cadastrar conta/fornecedor'],
  duplicidade:['Manter existente','Substituir']
};
const EVID = {
  valor_exato:'valor exato', valor_explicado:'valor explicado', valor_proximo:'valor próximo',
  documento_na_descricao:'nº doc na descrição', cnpj_contraparte:'CNPJ bate',
  nome_exato:'nome confere', nome_parcial:'nome parcial', data_exata:'data exata',
  data_proxima:'data próxima', data_na_janela:'data na janela',
  candidato_unico:'único candidato', par_transferencia:'par encontrado',
  dicionario_banco:'padrão do banco', regra_cliente:'regra do cliente'
};

let DADOS = [], FILTRO = 'pendentes', FEITOS = {};

document.getElementById('pick').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => { if(e.target.files[0]) ler(e.target.files[0]); };
const drop = document.getElementById('drop');
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on');}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) ler(f); });

function ler(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result);
      carregar(j.resultados || j, file.name);
    }catch(err){ alert('Não consegui ler esse JSON: ' + err.message); }
  };
  r.readAsText(file);
}

document.getElementById('demo').onclick = () => carregar(EXEMPLO, 'exemplo');

function carregar(rs, nome){
  DADOS = rs; FEITOS = {};
  document.getElementById('drop').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('ctx').textContent =
    rs.length + ' linhas · ' + nome; // textContent, sem HTML
  render();
}

function pendente(r){ return !FEITOS[r.linha_id] && r.faixa !== 'automatico'; }

function render(){
  const total = DADOS.length;
  const auto  = DADOS.filter(r=>r.faixa==='automatico').length;
  const rev   = DADOS.filter(r=>r.faixa==='revisao').length;
  const exc   = DADOS.filter(r=>r.faixa==='excecao').length;
  const pend  = DADOS.filter(pendente).length;
  const valorPend = DADOS.filter(pendente)
      .reduce((s,r)=>s+Math.abs(parseFloat(r.valor)),0);

  document.getElementById('kpis').innerHTML = `
    <div class="kpi ok"><div class="lab">Conciliado sozinho</div>
      <div class="val">${total?Math.round(auto/total*100):0}%</div>
      <div class="sub">${auto} de ${total} linhas</div></div>
    <div class="kpi warn"><div class="lab">Revisão</div>
      <div class="val">${rev}</div><div class="sub">candidato pré-selecionado</div></div>
    <div class="kpi crit"><div class="lab">Exceções</div>
      <div class="val">${exc}</div><div class="sub">exigem decisão</div></div>
    <div class="kpi"><div class="lab">Pendente na fila</div>
      <div class="val">${pend}</div>
      <div class="sub mono">${BRL(valorPend)} em jogo</div></div>`;

  document.getElementById('bar').innerHTML = total ? `
    <i style="width:${auto/total*100}%;background:var(--bom)"></i>
    <i style="width:${rev/total*100}%;background:var(--atencao)"></i>
    <i style="width:${exc/total*100}%;background:var(--critico)"></i>` : '';

  const tipos = {};
  DADOS.filter(r=>r.tipo_excecao).forEach(r=>tipos[r.tipo_excecao]=(tipos[r.tipo_excecao]||0)+1);
  let chips = `<button class="chip" data-f="pendentes" aria-pressed="${FILTRO==='pendentes'}">
      Pendentes <span class="n">${pend}</span></button>
    <button class="chip" data-f="revisao" aria-pressed="${FILTRO==='revisao'}">
      Revisão <span class="n">${rev}</span></button>`;
  Object.entries(tipos).sort((a,b)=>b[1]-a[1]).forEach(([t,n])=>{
    chips += `<button class="chip" data-f="${t}" aria-pressed="${FILTRO===t}">
      ${ROTULO[t]||t} <span class="n">${n}</span></button>`;
  });
  chips += `<button class="chip" data-f="todas" aria-pressed="${FILTRO==='todas'}">
      Todas <span class="n">${total}</span></button>`;
  const fl = document.getElementById('filters');
  fl.innerHTML = chips;
  fl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{FILTRO=c.dataset.f;render();});

  let lista = DADOS.filter(r=>{
    if(FILTRO==='pendentes') return pendente(r);
    if(FILTRO==='revisao')   return r.faixa==='revisao';
    if(FILTRO==='todas')     return true;
    return r.tipo_excecao===FILTRO;
  });
  // impacto: maior valor primeiro, depois mais antiga
  lista.sort((a,b)=>Math.abs(parseFloat(b.valor))-Math.abs(parseFloat(a.valor))
                 || a.data.localeCompare(b.data));

  document.getElementById('lista').innerHTML = lista.length
    ? lista.map(item).join('')
    : `<div class="empty">Nada pendente aqui. A conta está fechada quando o saldo do
       extrato bate com o do ERP.</div>`;

  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = () => { FEITOS[b.dataset.id] = b.dataset.act; render(); };
  });
}

function item(r){
  const v = parseFloat(r.valor);
  const faixa = {automatico:['auto','conciliado'],revisao:['rev','revisão'],excecao:['exc','exceção']}[r.faixa];
  const feito = FEITOS[r.linha_id];

  let sugestao = '';
  if(r.titulo_id){
    sugestao = `<div class="sug">
      <span class="k">Título sugerido</span>
      <b>${esc(r.titulo_parceiro||r.titulo_id)}</b> ·
      <span class="mono">${BRL(parseFloat(r.titulo_valor||0))}</span> ·
      vence ${DT(r.titulo_vencimento)}
      ${r.titulo_tem_documento===false?' · <span style="color:var(--atencao)">sem documento anexo</span>':''}
      ${r.motivo?`<div class="why">${esc(r.motivo)}</div>`:''}
      <div>${(r.evidencias||[]).map(e=>
        `<span class="ev">${esc(EVID[e.nome]||e.nome)} <b>+${e.pontos}</b></span>`).join('')}</div>
    </div>`;
  } else if(r.desfecho==='lanc_direto'){
    sugestao = `<div class="sug"><span class="k">Lançamento direto em conta corrente</span>
      ${esc(r.categoria||'categoria a definir')} — sem contas a pagar
      ${r.motivo?`<div class="why">${esc(r.motivo)}</div>`:''}</div>`;
  } else if(r.desfecho==='transferencia'){
    sugestao = `<div class="sug"><span class="k">Transferência entre contas</span>
      ${r.linha_par_id?'par: <span class="mono">'+esc(r.linha_par_id)+'</span>':'sem par identificado'}
      ${r.motivo?`<div class="why">${esc(r.motivo)}</div>`:''}</div>`;
  } else if(r.motivo){
    sugestao = `<div class="sug"><span class="k">Diagnóstico</span>${esc(r.motivo)}</div>`;
  }

  let alternativas = '';
  if(r.descartados && r.descartados.length){
    alternativas = `<details class="alt"><summary>${r.descartados.length} outro(s) candidato(s) avaliado(s)</summary>
      <div class="tablewrap"><table>${r.descartados.map(d=>
        `<tr><td>${esc(d.parceiro)}</td><td class="mono">${BRL(parseFloat(d.valor))}</td>
         <td>${DT(d.vencimento)}</td><td>${d.score} pts</td></tr>`).join('')}</table></div></details>`;
  }

  const acoes = feito
    ? `<div class="acts"><span class="tag auto">${esc(feito)}</span>
        <button class="btn ghost" data-act="" data-id="${esc(r.linha_id)}">desfazer</button></div>`
    : `<div class="acts">
        ${r.titulo_id?`<button class="btn pri" data-act="conciliado" data-id="${esc(r.linha_id)}">Confirmar título</button>`:''}
        ${(ACAO[r.tipo_excecao]||[]).map(a=>
          `<button class="btn" data-act="${esc(a)}" data-id="${esc(r.linha_id)}">${a}</button>`).join('')}
        ${r.desfecho==='lanc_direto'||r.desfecho==='transferencia'
          ?`<button class="btn pri" data-act="confirmado" data-id="${esc(r.linha_id)}">Confirmar</button>`:''}
        <button class="btn ghost" data-act="adiado" data-id="${esc(r.linha_id)}">Adiar</button>
      </div>`;

  return `<div class="item ${feito?'done':''}">
    <div class="row1">
      <span class="dt">${DT(r.data)}</span>
      <span class="vl ${v<0?'neg':'pos'}">${BRL(v)}</span>
      <span class="desc">${esc(r.descricao)}</span>
      ${r.tipo_excecao?`<span class="tag exc">${ROTULO[r.tipo_excecao]||r.tipo_excecao}</span>`:
        `<span class="tag ${faixa[0]}">${faixa[1]}</span>`}
      <span class="score">${r.score} pts</span>
    </div>
    ${sugestao}${alternativas}${acoes}
  </div>`;
}

const EXEMPLO = [
 {linha_id:'A1',data:'2026-09-10',valor:'-1500.00',descricao:'PAGTO DELL NF 4471',
  desfecho:'titulo',faixa:'automatico',score:100,titulo_id:'T1',
  titulo_parceiro:'DELL COMPUTADORES DO BRASIL LTDA',titulo_valor:'1500.00',
  titulo_vencimento:'2026-09-10',titulo_tem_documento:true,descartados:[],motivo:'',
  evidencias:[{nome:'valor_exato',pontos:45},{nome:'documento_na_descricao',pontos:35},
              {nome:'data_exata',pontos:10},{nome:'candidato_unico',pontos:10}]},
 {linha_id:'A2',data:'2026-09-12',valor:'-89.90',descricao:'TAR PCT SERVICOS',
  desfecho:'lanc_direto',faixa:'automatico',score:90,categoria:'Despesas Bancárias',
  motivo:'tarifa reconhecida pelo dicionário do banco',descartados:[],evidencias:[]},
 {linha_id:'A3',data:'2026-09-15',valor:'4850.00',descricao:'CREDITO CLIENTE ALFA IRRF RETIDO',
  desfecho:'titulo',faixa:'revisao',score:60,titulo_id:'T2',titulo_parceiro:'CLIENTE ALFA LTDA',
  titulo_valor:'5000.00',titulo_vencimento:'2026-09-15',titulo_tem_documento:false,
  motivo:'retenção de imposto na fonte',descartados:[],
  evidencias:[{nome:'valor_explicado',pontos:40},{nome:'data_exata',pontos:10},
              {nome:'candidato_unico',pontos:10}]},
 {linha_id:'A4',data:'2026-09-16',valor:'-3200.00',descricao:'PIX ENVIADO JOSE SILVA',
  desfecho:'fila',faixa:'excecao',score:0,tipo_excecao:'sem_titulo_saida',
  motivo:'Nenhum título em aberto compatível e nenhum padrão de lançamento direto.',
  descartados:[],evidencias:[]},
 {linha_id:'A5',data:'2026-09-17',valor:'-2000.00',descricao:'PAGTO MENSALIDADE',
  desfecho:'fila',faixa:'excecao',score:55,tipo_excecao:'ambiguidade',
  motivo:'2 candidatos com score equivalente.',titulo_id:'T4a',
  titulo_parceiro:'ALFA CONSULTORIA',titulo_valor:'2000.00',titulo_vencimento:'2026-09-17',
  descartados:[{titulo_id:'T4b',parceiro:'BETA CONSULTORIA',valor:'2000.00',
                vencimento:'2026-09-17',score:55}],
  evidencias:[{nome:'valor_exato',pontos:45},{nome:'data_exata',pontos:10}]},
 {linha_id:'A6',data:'2026-09-18',valor:'-50000.00',descricao:'TRANSF ENTRE CONTAS',
  desfecho:'transferencia',faixa:'automatico',score:95,linha_par_id:'A7',
  motivo:'Par encontrado em outra conta da empresa.',descartados:[],
  evidencias:[{nome:'par_transferencia',pontos:95}]},
 {linha_id:'A8',data:'2026-09-19',valor:'-80000.00',descricao:'APLIC AUT MAIS',
  desfecho:'fila',faixa:'excecao',score:0,tipo_excecao:'cadastro',
  motivo:'Aplicação/resgate detectado, mas a conta de investimento não está cadastrada.',
  descartados:[],evidencias:[]}
];
</script>
</body>
</html>
