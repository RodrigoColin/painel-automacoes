# Site do painel no nginx do host — mesmo desenho do n8n.proos.com.br que já
# roda nesta VPS. Instalação (ver deploy/LEIA-ME.md):
#
#   sudo cp painel.conf /etc/nginx/sites-available/<dominio>
#   (troque DOMINIO abaixo pelo domínio real)
#   sudo ln -s /etc/nginx/sites-available/<dominio> /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <dominio>
#
# O certbot acrescenta sozinho o bloco `listen 443 ssl` e o redirecionamento
# do HTTP, como fez no site do n8n.

server {
    listen 80;
    server_name DOMINIO;

    # Script .py de até 1 MB via Server Action, com folga para o multipart
    # (o Next aceita até 2 MB, ver next.config.ts).
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # O Next confere Origin contra Host nas Server Actions: sem o Host
        # original, todo formulário do painel seria recusado.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # As rotas de cron são chamadas pelo container `cron`, pela rede interna
    # do Docker. De fora não há motivo para alcançá-las — o Bearer já
    # protege, isto só tira a superfície.
    location ~ ^/api/(agendador|sincronizar-n8n|sincronizar-omie)$ {
        return 404;
    }
}
